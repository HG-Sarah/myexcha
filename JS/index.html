<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카운터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Counter card -->
  <div class="card">
    <p class="label">카운터</p>
    <p class="count" id="count">0</p>
    <div class="buttons">
      <button id="decrease">-</button>
      <button id="reset">리셋</button>
      <button id="increase">+</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
